name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci || npm install
      - name: Contract pin
        run: npm run contract:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep for every environment
        run: |
          for env in dev test prod; do
            echo "::group::$env"
            az bicep build-params --file "infra/envs/$env.bicepparam" --outfile /dev/null
            echo "::endgroup::"
          done
